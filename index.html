<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Co Founder — AI Website Builder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState } = React;

const FIELD_STYLE =
  "w-full px-3 py-2 rounded-md border border-[#D9D2C4] bg-white text-[#2B2823] placeholder-[#A79E8C] focus:outline-none focus:ring-2 focus:ring-[#C9A24B] text-sm";

// Point this at your running backend (see backend/README.md)
const BACKEND_URL = "https://cofounder-ai-website-builder.onrender.com";

function AIWebsiteBuilder() {
  const [token, setToken] = useState(null);
  const [authEmail, setAuthEmail] = useState("");
  const [authPassword, setAuthPassword] = useState("");
  const [authMode, setAuthMode] = useState("login"); // "login" | "signup"
  const [authError, setAuthError] = useState("");
  const [authLoading, setAuthLoading] = useState(false);

  const [businessName, setBusinessName] = useState("");
  const [businessType, setBusinessType] = useState("");
  const [description, setDescription] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [variants, setVariants] = useState(null);
  const [selectedIdx, setSelectedIdx] = useState(0);
  const [editing, setEditing] = useState(false);
  const [liveUrl, setLiveUrl] = useState("");
  const [publishing, setPublishing] = useState(false);

  const canGenerate = businessName.trim() && businessType.trim() && !loading;
  const site = variants ? variants[selectedIdx] : null;

  function updateField(path, value) {
    setVariants((prev) => {
      const next = prev.map((v) => ({ ...v, services: v.services?.map((s) => ({ ...s })) }));
      const target = next[selectedIdx];
      if (path.startsWith("service.")) {
        const [, idxStr, key] = path.split(".");
        target.services[Number(idxStr)][key] = value;
      } else {
        target[path] = value;
      }
      return next;
    });
  }

  async function handleAuthSubmit() {
    setAuthLoading(true);
    setAuthError("");
    try {
      const endpoint = authMode === "login" ? "/api/auth/login" : "/api/auth/signup";
      const response = await fetch(`${BACKEND_URL}${endpoint}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: authEmail, password: authPassword }),
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error);
      setToken(data.token);
    } catch (e) {
      setAuthError(e.message || "Something went wrong");
    } finally {
      setAuthLoading(false);
    }
  }

  function logout() {
    setToken(null);
    setVariants(null);
    setLiveUrl("");
  }

  async function publishToBackend() {
    if (!site) return;
    setPublishing(true);
    setLiveUrl("");
    try {
      const response = await fetch(`${BACKEND_URL}/api/sites`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`,
        },
        body: JSON.stringify({ businessName, siteData: site }),
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error);
      setLiveUrl(`${BACKEND_URL}/site/${data.slug}`);
    } catch (e) {
      setError("Couldn't publish. Is the backend server running?");
    } finally {
      setPublishing(false);
    }
  }

  function exportSiteHTML() {
    if (!site) return;
    const servicesHTML = (site.services || [])
      .map(
        (s) => `<div style="text-align:center;flex:1;min-width:150px;">
          <h3 style="font-family:Georgia,serif;font-size:16px;margin-bottom:4px;color:${mood.dark}">${s.name}</h3>
          <p style="font-size:13px;opacity:0.7;color:${mood.dark}">${s.desc}</p>
        </div>`
      )
      .join("");

    const html = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>${businessName}</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body style="margin:0;font-family:-apple-system,sans-serif;background:${mood.bg}">
  <div style="padding:80px 40px;text-align:center;color:${mood.dark}">
    <p style="font-size:13px;letter-spacing:0.5px;font-weight:500;color:${mood.accent};margin-bottom:12px">${businessName}</p>
    <h1 style="font-family:Georgia,serif;font-size:36px;font-weight:400;margin-bottom:16px">${site.tagline}</h1>
    <p style="font-size:15px;max-width:500px;margin:0 auto 24px;opacity:0.8">${site.hero_description}</p>
    <button style="padding:10px 22px;border-radius:6px;border:none;background:${mood.accent};color:white;font-size:14px;font-weight:500;cursor:pointer">${site.cta}</button>
  </div>
  <div style="padding:40px;background:rgba(255,255,255,0.5)">
    <div style="display:flex;gap:24px;flex-wrap:wrap;justify-content:center;max-width:800px;margin:0 auto">
      ${servicesHTML}
    </div>
  </div>
  <div style="padding:40px;text-align:center;color:${mood.dark}">
    <h2 style="font-family:Georgia,serif;font-size:22px;margin-bottom:12px">About us</h2>
    <p style="font-size:14px;max-width:600px;margin:0 auto;opacity:0.8">${site.about}</p>
  </div>
  <div style="padding:32px;text-align:center;background:${mood.dark};color:${mood.bg}">
    <p style="font-size:14px">${site.contact_line}</p>
  </div>
</body>
</html>`;

    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${businessName.trim().replace(/\s+/g, "-").toLowerCase() || "site"}.html`;
    a.click();
    URL.revokeObjectURL(url);
  }

  const EditableText = ({ value, onChange, className, style, tag = "p" }) => {
    const Tag = tag;
    if (!editing) return <Tag className={className} style={style}>{value}</Tag>;
    return (
      <Tag
        className={className}
        style={{ ...style, outline: "none", borderBottom: "1px dashed currentColor", cursor: "text" }}
        contentEditable
        suppressContentEditableWarning
        onBlur={(e) => onChange(e.currentTarget.textContent)}
      >
        {value}
      </Tag>
    );
  };

  async function generateSite() {
    setLoading(true);
    setError("");
    setVariants(null);
    try {
      const prompt = `You are generating website copy for a small business. Return ONLY raw JSON, no markdown fences, no preamble.

Business name: ${businessName}
Business type: ${businessType}
Extra details from owner: ${description || "none provided"}

Generate 3 DIFFERENT design directions for this business's website. Each should feel distinct in tone/mood (e.g. one warm and cozy, one modern and minimal, one bold and energetic) while staying true to the business. Vary the tagline style, the about tone, and the accent_mood across the three.

Return JSON with this exact shape (an array of exactly 3 items):
[
  {
    "style_label": "short 2-3 word label describing this direction, e.g. 'Warm & Rustic'",
    "tagline": "short punchy tagline, under 8 words",
    "hero_description": "1-2 sentence welcoming description of the business",
    "services": [
      {"name": "service or product name", "desc": "one short sentence"},
      {"name": "...", "desc": "..."},
      {"name": "...", "desc": "..."}
    ],
    "about": "2-3 sentence about section written warmly, in first person plural (we/our)",
    "cta": "short call to action button text, 2-4 words",
    "contact_line": "one short inviting sentence encouraging visitors to reach out",
    "accent_mood": "one of: warm, fresh, elegant, bold, earthy"
  },
  { ... second variant, different direction ... },
  { ... third variant, different direction ... }
]`;

      const response = await fetch(`${BACKEND_URL}/api/generate`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`,
        },
        body: JSON.stringify({ businessName, businessType, description }),
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error);
      setVariants(data.variants);
      setSelectedIdx(0);
    } catch (e) {
      setError("Couldn't generate the site. Try again in a moment.");
    } finally {
      setLoading(false);
    }
  }

  const moodColors = {
    warm: { bg: "#FBF4EC", accent: "#C9A24B", dark: "#4A3A20" },
    fresh: { bg: "#F2F7F1", accent: "#4B7A5A", dark: "#1F3A2E" },
    elegant: { bg: "#F6F5F8", accent: "#6B5B95", dark: "#2E2640" },
    bold: { bg: "#FFF3F0", accent: "#C9532F", dark: "#3A1F14" },
    earthy: { bg: "#F5F1E8", accent: "#8A6B4E", dark: "#3A2E1F" },
  };
  const mood = moodColors[site?.accent_mood] || moodColors.warm;

  if (!token) {
    return (
      <div className="min-h-screen w-full bg-[#FAF7F2] flex items-center justify-center p-6">
        <div className="w-full max-w-sm bg-white rounded-lg border border-[#E5DFD1] p-6">
          <h1 className="text-lg font-semibold text-[#1F3A2E] mb-1">
            {authMode === "login" ? "Log in" : "Create an account"}
          </h1>
          <p className="text-sm text-[#6B6455] mb-5">
            {authMode === "login"
              ? "Log in to manage your sites."
              : "Sign up to start building your website."}
          </p>

          <div className="flex flex-col gap-3">
            <input
              className={FIELD_STYLE}
              type="email"
              placeholder="Email"
              value={authEmail}
              onChange={(e) => setAuthEmail(e.target.value)}
            />
            <input
              className={FIELD_STYLE}
              type="password"
              placeholder="Password"
              value={authPassword}
              onChange={(e) => setAuthPassword(e.target.value)}
            />
            {authError && <p className="text-sm text-[#B23B3B]">{authError}</p>}
            <button
              onClick={handleAuthSubmit}
              disabled={authLoading || !authEmail || !authPassword}
              className="py-2.5 rounded-md bg-[#1F3A2E] text-white text-sm font-medium disabled:opacity-40 hover:bg-[#16291F] transition-colors"
            >
              {authLoading ? "Please wait..." : authMode === "login" ? "Log in" : "Sign up"}
            </button>
          </div>

          <button
            onClick={() => {
              setAuthMode((m) => (m === "login" ? "signup" : "login"));
              setAuthError("");
            }}
            className="mt-4 text-sm text-[#6B6455] underline"
          >
            {authMode === "login" ? "New here? Create an account" : "Already have an account? Log in"}
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen w-full bg-[#FAF7F2] flex flex-col md:flex-row">
      {/* LEFT: tool UI */}
      <div className="md:w-[380px] w-full border-b md:border-b-0 md:border-r border-[#E5DFD1] p-6 flex flex-col gap-4">
        <div>
          <div className="flex items-center justify-between">
            <h1 className="text-lg font-semibold text-[#1F3A2E]">Build your site</h1>
            <button onClick={logout} className="text-xs text-[#A79E8C] underline">
              Log out
            </button>
          </div>
          <p className="text-sm text-[#6B6455] mt-1">
            Tell us about your business. We'll generate a starting website.
          </p>
        </div>

        <div className="flex flex-col gap-1">
          <label className="text-xs font-medium text-[#6B6455]">Business name</label>
          <input
            className={FIELD_STYLE}
            placeholder="e.g. Riverstone Bakery"
            value={businessName}
            onChange={(e) => setBusinessName(e.target.value)}
          />
        </div>

        <div className="flex flex-col gap-1">
          <label className="text-xs font-medium text-[#6B6455]">Type of business</label>
          <input
            className={FIELD_STYLE}
            placeholder="e.g. neighborhood bakery"
            value={businessType}
            onChange={(e) => setBusinessType(e.target.value)}
          />
        </div>

        <div className="flex flex-col gap-1">
          <label className="text-xs font-medium text-[#6B6455]">
            Anything else? <span className="text-[#A79E8C]">(optional)</span>
          </label>
          <textarea
            className={FIELD_STYLE + " min-h-[90px] resize-none"}
            placeholder="e.g. we do custom cakes, family run since 2010"
            value={description}
            onChange={(e) => setDescription(e.target.value)}
          />
        </div>

        <button
          onClick={generateSite}
          disabled={!canGenerate}
          className="mt-1 py-2.5 rounded-md bg-[#1F3A2E] text-white text-sm font-medium disabled:opacity-40 disabled:cursor-not-allowed hover:bg-[#16291F] transition-colors"
        >
          {loading ? "Generating..." : "Generate website"}
        </button>

        {error && <p className="text-sm text-[#B23B3B]">{error}</p>}

        <p className="text-xs text-[#A79E8C] mt-auto pt-4">
          Prototype — "Publish" downloads a standalone HTML file. Real one-click hosting/domain setup would be a backend feature.
        </p>
      </div>

      {/* RIGHT: generated site preview */}
      <div className="flex-1 p-6 md:p-10 overflow-auto">
        {!variants && !loading && (
          <div className="h-full flex items-center justify-center text-center">
            <p className="text-[#A79E8C] text-sm max-w-xs">
              Fill in your business details and generate to see 3 website design options here.
            </p>
          </div>
        )}

        {loading && (
          <div className="h-full flex items-center justify-center">
            <p className="text-[#6B6455] text-sm">Writing 3 design directions...</p>
          </div>
        )}

        {variants && (
          <div className="flex gap-2 mb-5 items-center flex-wrap">
            {variants.map((v, i) => (
              <button
                key={i}
                onClick={() => setSelectedIdx(i)}
                className={
                  "px-4 py-2 rounded-md text-sm font-medium border transition-colors " +
                  (i === selectedIdx
                    ? "bg-[#1F3A2E] text-white border-[#1F3A2E]"
                    : "bg-white text-[#6B6455] border-[#E5DFD1] hover:border-[#C9A24B]")
                }
              >
                {v.style_label || `Option ${i + 1}`}
              </button>
            ))}
            <button
              onClick={() => setEditing((e) => !e)}
              className={
                "px-4 py-2 rounded-md text-sm font-medium border transition-colors " +
                (editing
                  ? "bg-[#C9A24B] text-white border-[#C9A24B]"
                  : "bg-white text-[#6B6455] border-[#E5DFD1] hover:border-[#C9A24B]")
              }
            >
              {editing ? "Done editing" : "Edit text"}
            </button>
            <button
              onClick={publishToBackend}
              disabled={publishing}
              className="ml-auto px-4 py-2 rounded-md text-sm font-medium bg-[#1F3A2E] text-white hover:bg-[#16291F] transition-colors disabled:opacity-50"
            >
              {publishing ? "Publishing..." : "Publish live"}
            </button>
            <button
              onClick={exportSiteHTML}
              className="px-4 py-2 rounded-md text-sm font-medium border border-[#E5DFD1] text-[#6B6455] hover:border-[#C9A24B] transition-colors"
            >
              Download HTML
            </button>
          </div>
        )}

        {liveUrl && (
          <div className="mb-5 px-4 py-3 rounded-md bg-[#F2F7F1] border border-[#C9E4CE] text-sm text-[#1F3A2E]">
            🎉 Live at{" "}
            <a href={liveUrl} target="_blank" rel="noreferrer" className="underline font-medium">
              {liveUrl}
            </a>
          </div>
        )}

        {site && (
          <div
            className="rounded-lg overflow-hidden shadow-sm border border-[#E5DFD1]"
            style={{ backgroundColor: mood.bg }}
          >
            {/* hero */}
            <div className="px-10 py-16 text-center" style={{ color: mood.dark }}>
              <p
                className="text-xs tracking-wide font-medium mb-3"
                style={{ color: mood.accent }}
              >
                {businessName}
              </p>
              <EditableText
                tag="h2"
                style={{ fontFamily: "Georgia, serif" }}
                className="text-3xl md:text-4xl font-normal mb-4"
                value={site.tagline}
                onChange={(v) => updateField("tagline", v)}
              />
              <EditableText
                className="text-sm max-w-md mx-auto opacity-80"
                value={site.hero_description}
                onChange={(v) => updateField("hero_description", v)}
              />
              <button
                className="mt-6 px-5 py-2 rounded-md text-sm font-medium text-white"
                style={{ backgroundColor: mood.accent }}
              >
                <EditableText
                  tag="span"
                  className=""
                  value={site.cta}
                  onChange={(v) => updateField("cta", v)}
                />
              </button>
            </div>

            {/* services */}
            <div className="px-10 py-10 bg-white/50">
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                {site.services?.map((s, i) => (
                  <div key={i} className="text-center">
                    <EditableText
                      tag="h3"
                      style={{ color: mood.dark, fontFamily: "Georgia, serif" }}
                      className="text-base mb-1"
                      value={s.name}
                      onChange={(v) => updateField(`service.${i}.name`, v)}
                    />
                    <EditableText
                      tag="p"
                      className="text-xs opacity-70"
                      style={{ color: mood.dark }}
                      value={s.desc}
                      onChange={(v) => updateField(`service.${i}.desc`, v)}
                    />
                  </div>
                ))}
              </div>
            </div>

            {/* about */}
            <div className="px-10 py-10 text-center" style={{ color: mood.dark }}>
              <h3
                style={{ fontFamily: "Georgia, serif" }}
                className="text-xl mb-3"
              >
                About us
              </h3>
              <EditableText
                className="text-sm max-w-lg mx-auto opacity-80"
                value={site.about}
                onChange={(v) => updateField("about", v)}
              />
            </div>

            {/* contact */}
            <div
              className="px-10 py-8 text-center"
              style={{ backgroundColor: mood.dark, color: mood.bg }}
            >
              <EditableText
                tag="p"
                className="text-sm"
                value={site.contact_line}
                onChange={(v) => updateField("contact_line", v)}
              />
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AIWebsiteBuilder />);
</script>
</body>
</html>
