function AIWebsiteBuilder() {
  const SECURITY_QUESTIONS = [
    "What was the name of your first pet?",
    "What city were you born in?",
    "What is your favorite food?",
    "What was the name of your first school?",
  ];

  const [token, setToken] = useState(null);
  const [authEmail, setAuthEmail] = useState("");
  const [authPassword, setAuthPassword] = useState("");
  const [authMode, setAuthMode] = useState("login"); // "login" | "signup"
  const [authError, setAuthError] = useState("");
  const [authFieldErrors, setAuthFieldErrors] = useState({});
  const [authLoading, setAuthLoading] = useState(false);
  const [securityQuestion, setSecurityQuestion] = useState(SECURITY_QUESTIONS[0]);
  const [securityAnswer, setSecurityAnswer] = useState("");

  const [showForgotPassword, setShowForgotPassword] = useState(false);
  const [forgotStep, setForgotStep] = useState(1); // 1: email, 2: answer+new password
  const [forgotEmail, setForgotEmail] = useState("");
  const [forgotQuestion, setForgotQuestion] = useState("");
  const [forgotAnswer, setForgotAnswer] = useState("");
  const [forgotNewPassword, setForgotNewPassword] = useState("");
  const [forgotError, setForgotError] = useState("");
  const [forgotSuccess, setForgotSuccess] = useState(false);
  const [forgotLoading, setForgotLoading] = useState(false);

  const [businessName, setBusinessName] = useState("");
  const [businessType, setBusinessType] = useState("");
  const [description, setDescription] = useState("");
  const [heroImage, setHeroImage] = useState(null);
  const [imageError, setImageError] = useState("");
  const [language, setLanguage] = useState("english");
  const [whatsappNumber, setWhatsappNumber] = useState("");
  const [address, setAddress] = useState("");
  const [hoursOpen, setHoursOpen] = useState("");
  const [hoursClose, setHoursClose] = useState("");
  const [hoursClosedDays, setHoursClosedDays] = useState([]);
  const [socialInstagram, setSocialInstagram] = useState("");
  const [socialFacebook, setSocialFacebook] = useState("");
  const [reviews, setReviews] = useState([]);
  const [reviewName, setReviewName] = useState("");
  const [reviewText, setReviewText] = useState("");
  const [showMessages, setShowMessages] = useState(false);
  const [messagesList, setMessagesList] = useState([]);
  const [loadingMessages, setLoadingMessages] = useState(false);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [variants, setVariants] = useState(null);
  const [selectedIdx, setSelectedIdx] = useState(0);
  const [editing, setEditing] = useState(false);
  const [liveUrl, setLiveUrl] = useState("");
  const [publishing, setPublishing] = useState(false);

  const [showMySites, setShowMySites] = useState(false);
  const [mySites, setMySites] = useState([]);
  const [loadingMySites, setLoadingMySites] = useState(false);
  const [editingSlug, setEditingSlug] = useState(null);
  const [deletingSlug, setDeletingSlug] = useState(null);

  const canGenerate = businessName.trim() && businessType.trim() && !loading;
  const site = variants ? variants[selectedIdx] : null;

  function updateField(path, value) {
    setVariants((prev) => {
      const next = prev.map((v) => ({ ...v, services: v.services?.map((s) => ({ ...s })) }));
      const target = next[selectedIdx];
      if (path.startsWith("service.")) {
        const [, idxStr, key] = path.split(".");
        target.services[Number(idxStr)][key] = value;
      } else {
        target[path] = value;
      }
      return next;
    });
  }

  function validateAuthFields() {
    const errs = {};
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(authEmail.trim())) {
      errs.email = "Enter a valid email address";
    }
    if (authMode === "signup") {
      if (authPassword.length < 8 || !/[0-9]/.test(authPassword) || !/[a-zA-Z]/.test(authPassword)) {
        errs.password = "At least 8 characters, with a letter and a number";
      }
      if (!securityAnswer.trim()) {
        errs.securityAnswer = "Please answer the security question (used to reset your password)";
      }
    } else if (!authPassword) {
      errs.password = "Enter your password";
    }
    setAuthFieldErrors(errs);
    return Object.keys(errs).length === 0;
  }

  async function handleAuthSubmit() {
    if (!validateAuthFields()) return;
    setAuthLoading(true);
    setAuthError("");
    try {
      const endpoint = authMode === "login" ? "/api/auth/login" : "/api/auth/signup";
      const body =
        authMode === "login"
          ? { email: authEmail, password: authPassword }
          : { email: authEmail, password: authPassword, securityQuestion, securityAnswer };
      const response = await fetch(`${BACKEND_URL}${endpoint}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error);
      setToken(data.token);
    } catch (e) {
      setAuthError(e.message || "Something went wrong");
    } finally {
      setAuthLoading(false);
    }
  }

  async function fetchSecurityQuestion() {
    setForgotError("");
    setForgotLoading(true);
    try {
      const response = await fetch(
        `${BACKEND_URL}/api/auth/security-question?email=${encodeURIComponent(forgotEmail)}`
      );
      const data = await response.json();
      if (data.error) throw new Error(data.error);
      setForgotQuestion(data.securityQuestion);
      setForgotStep(2);
    } catch (e) {
      setForgotError(e.message || "Couldn't find that account");
    } finally {
      setForgotLoading(false);
    }
  }

  async function submitPasswordReset() {
    setForgotError("");
    if (forgotNewPassword.length < 8 || !/[0-9]/.test(forgotNewPassword) || !/[a-zA-Z]/.test(forgotNewPassword)) {
      setForgotError("New password needs at least 8 characters, with a letter and a number");
      return;
    }
    setForgotLoading(true);
    try {
      const response = await fetch(`${BACKEND_URL}/api/auth/reset-password`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: forgotEmail, securityAnswer: forgotAnswer, newPassword: forgotNewPassword }),
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error);
      setForgotSuccess(true);
    } catch (e) {
      setForgotError(e.message || "Couldn't reset password");
    } finally {
      setForgotLoading(false);
    }
  }

  function closeForgotPassword() {
    setShowForgotPassword(false);
    setForgotStep(1);
    setForgotEmail("");
    setForgotQuestion("");
    setForgotAnswer("");
    setForgotNewPassword("");
    setForgotError("");
    setForgotSuccess(false);
  }

  function handleImageSelect(file) {
    setImageError("");
    if (!file) return;
    if (!file.type.startsWith("image/")) {
      setImageError("Please select an image file");
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const maxWidth = 900;
        const scale = Math.min(1, maxWidth / img.width);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.75);
        if (dataUrl.length > 1_500_000) {
          setImageError("Image is too large even after compression. Try a smaller photo.");
          return;
        }
        setHeroImage(dataUrl);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function toggleClosedDay(day) {
    setHoursClosedDays((prev) => (prev.includes(day) ? prev.filter((d) => d !== day) : [...prev, day]));
  }

  function addReview() {
    if (!reviewName.trim() || !reviewText.trim()) return;
    setReviews((prev) => [...prev, { name: reviewName.trim(), text: reviewText.trim() }]);
    setReviewName("");
    setReviewText("");
  }

  function removeReview(idx) {
    setReviews((prev) => prev.filter((_, i) => i !== idx));
  }

  async function openMessagesForSite(slug) {
    setShowMessages(true);
    setLoadingMessages(true);
    try {
      const response = await fetch(`${BACKEND_URL}/api/sites/${slug}/messages`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      const data = await response.json();
      setMessagesList(Array.isArray(data) ? data : []);
    } catch (e) {
      setMessagesList([]);
    } finally {
      setLoadingMessages(false);
    }
  }

  function logout() {
    setToken(null);
    setVariants(null);
    setLiveUrl("");
  }

  async function fetchMySites() {
    setLoadingMySites(true);
    try {
      const response = await fetch(`${BACKEND_URL}/api/sites`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      const data = await response.json();
      setMySites(Array.isArray(data) ? data : []);
    } catch (e) {
      setMySites([]);
    } finally {
      setLoadingMySites(false);
    }
  }

  function openMySites() {
    setShowMySites(true);
    fetchMySites();
  }

  function openSiteForEdit(record) {
    setEditingSlug(record.slug);
    setBusinessName(record.businessName);
    setBusinessType("");
    setDescription("");
    setVariants([record.siteData]);
    setSelectedIdx(0);
    setHeroImage(record.siteData.heroImage || null);
    setWhatsappNumber(record.siteData.whatsappNumber || "");
    setAddress(record.siteData.address || "");
    setHoursOpen((record.siteData.hours && record.siteData.hours.open) || "");
    setHoursClose((record.siteData.hours && record.siteData.hours.close) || "");
    setHoursClosedDays((record.siteData.hours && record.siteData.hours.closedDays) || []);
    setSocialInstagram(record.siteData.socialInstagram || "");
    setSocialFacebook(record.siteData.socialFacebook || "");
    setReviews(record.siteData.reviews || []);
    setLiveUrl(`${BACKEND_URL}/site/${record.slug}`);
    setShowMySites(false);
  }

  async function deleteSite(slug) {
    setDeletingSlug(slug);
    try {
      await fetch(`${BACKEND_URL}/api/sites/${slug}`, {
        method: "DELETE",
        headers: { Authorization: `Bearer ${token}` },
      });
      setMySites((prev) => prev.filter((s) => s.slug !== slug));
      if (editingSlug === slug) {
        setEditingSlug(null);
        setVariants(null);
        setLiveUrl("");
      }
    } catch (e) {
      // silently ignore, list stays as-is
    } finally {
      setDeletingSlug(null);
    }
  }

  function startNewSite() {
    setEditingSlug(null);
    setBusinessName("");
    setBusinessType("");
    setDescription("");
    setVariants(null);
    setLiveUrl("");
    setError("");
    setHeroImage(null);
    setImageError("");
    setWhatsappNumber("");
    setAddress("");
    setHoursOpen("");
    setHoursClose("");
    setHoursClosedDays([]);
    setSocialInstagram("");
    setSocialFacebook("");
    setReviews([]);
  }

  async function publishToBackend() {
    if (!site) return;
    setPublishing(true);
    setLiveUrl("");
    try {
      const isEdit = Boolean(editingSlug);
      const url = isEdit ? `${BACKEND_URL}/api/sites/${editingSlug}` : `${BACKEND_URL}/api/sites`;
      const siteDataToSend = {
        ...site,
        heroImage: heroImage || null,
        whatsappNumber: whatsappNumber || null,
        address: address || null,
        hours: hoursOpen && hoursClose ? { open: hoursOpen, close: hoursClose, closedDays: hoursClosedDays } : null,
        socialInstagram: socialInstagram || null,
        socialFacebook: socialFacebook || null,
        reviews,
      };
      const response = await fetch(url, {
        method: isEdit ? "PUT" : "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`,
        },
        body: JSON.stringify({ businessName, siteData: siteDataToSend }),
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error);
      const slug = isEdit ? editingSlug : data.slug;
      setLiveUrl(`${BACKEND_URL}/site/${slug}`);
    } catch (e) {
      setError("Couldn't publish. Is the backend server running?");
    } finally {
      setPublishing(false);
    }
  }

<html lang="en">
<head>
<meta charset="UTF-8" />
<title>${businessName}</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <p style="font-size:14px">${site.contact_line}</p>
  </div>
</body>
</html>`;

    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${businessName.trim().replace(/\s+/g, "-").toLowerCase() || "site"}.html`;
    a.click();
    URL.revokeObjectURL(url);
  }

              onClick={publishToBackend}
              disabled={publishing}
              className="ml-auto px-4 py-2 rounded-md text-sm font-medium bg-[#1F3A2E] text-white hover:bg-[#16291F] transition-colors disabled:opacity-50"
            >
              {publishing ? "Publishing..." : "Publish live"}
            </button>
            <button
              onClick={exportSiteHTML}
              className="px-4 py-2 rounded-md text-sm font-medium border border-[#E5DFD1] text-[#6B6455] hover:border-[#C9A24B] transition-colors"
            >
              Download HTML
            </button>
          </div>
        )}

        {liveUrl && (
          <div className="mb-5 px-4 py-3 rounded-md bg-[#F2F7F1] border border-[#C9E4CE] text-sm text-[#1F3A2E]">
            🎉 Live at{" "}
            <a href={liveUrl} target="_blank" rel="noreferrer" className="underline font-medium">
              {liveUrl}
            </a>
            <div className="mt-3 flex items-center gap-3">
              <img src={`${liveUrl}/qr.png`} alt="QR code" className="w-20 h-20 rounded border border-[#C9E4CE] bg-white" />
              <a
                href={`${liveUrl}/qr.png`}
                download
                className="text-xs underline text-[#1F3A2E]"
              >
                Download QR code
              </a>
            </div>
          </div>
        )}

        {site && (
          <div
            className="rounded-lg overflow-hidden shadow-sm border border-[#E5DFD1]"
            style={{ backgroundColor: mood.bg }}
          >
            {/* hero */}
            <div className="px-10 py-16 text-center" style={{ color: mood.dark }}>
              {heroImage && (
                <img
                  src={heroImage}
                  alt={businessName}
                  className="max-w-full mx-auto mb-5 rounded-lg"
                  style={{ maxHeight: "220px", objectFit: "cover" }}
                />
              )}
              <p
                className="text-xs tracking-wide font-medium mb-3"
                style={{ color: mood.accent }}
              >
                {businessName}
              </p>
              <EditableText
                tag="h2"
                style={{ fontFamily: "Georgia, serif" }}
                className="text-3xl md:text-4xl font-normal mb-4"
                value={site.tagline}
                onChange={(v) => updateField("tagline", v)}
              />
              <EditableText
                className="text-sm max-w-md mx-auto opacity-80"
                value={site.hero_description}
                onChange={(v) => updateField("hero_description", v)}
              />
              <button
                className="mt-6 px-5 py-2 rounded-md text-sm font-medium text-white"
                style={{ backgroundColor: mood.accent }}
              >
                <EditableText
                  tag="span"
                  className=""
                  value={site.cta}
                  onChange={(v) => updateField("cta", v)}
                />
              </button>
            </div>

            {/* services */}
            <div className="px-10 py-10 bg-white/50">
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                {site.services?.map((s, i) => (
                  <div key={i} className="text-center">
                    <EditableText
                      tag="h3"
                      style={{ color: mood.dark, fontFamily: "Georgia, serif" }}
                      className="text-base mb-1"
                      value={s.name}
                      onChange={(v) => updateField(`service.${i}.name`, v)}
                    />
                    <EditableText
                      tag="p"
                      className="text-xs opacity-70"
                      style={{ color: mood.dark }}
                      value={s.desc}
                      onChange={(v) => updateField(`service.${i}.desc`, v)}
                    />
                  </div>
                ))}
              </div>
            </div>

            {/* about */}
            <div className="px-10 py-10 text-center" style={{ color: mood.dark }}>
              <h3
                style={{ fontFamily: "Georgia, serif" }}
                className="text-xl mb-3"
              >
                About us
              </h3>
              <EditableText
                className="text-sm max-w-lg mx-auto opacity-80"
                value={site.about}
                onChange={(v) => updateField("about", v)}
              />
            </div>

            {/* contact */}
            <div
              className="px-10 py-8 text-center"
              style={{ backgroundColor: mood.dark, color: mood.bg }}
            >
              <EditableText
                tag="p"
                className="text-sm"
                value={site.contact_line}
                onChange={(v) => updateField("contact_line", v)}
              />
            </div>
          </div>
        )}
      </div>

      {showMySites && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-lg w-full max-w-md max-h-[80vh] overflow-y-auto">
            <div className="flex items-center justify-between p-4 border-b border-[#E5DFD1] sticky top-0 bg-white">
              <h2 className="font-semibold text-[#1F3A2E]">My Sites</h2>
              <button onClick={() => setShowMySites(false)} className="text-sm text-[#A79E8C]">
                Close
              </button>
            </div>
            <div className="p-4 flex flex-col gap-3">
              {loadingMySites && <p className="text-sm text-[#6B6455]">Loading...</p>}
              {!loadingMySites && mySites.length === 0 && (
                <p className="text-sm text-[#6B6455]">
                  You haven't published any sites yet. Generate one and hit Publish!
                </p>
              )}
              {mySites.map((s) => (
                <div key={s.slug} className="border border-[#E5DFD1] rounded-md p-3 flex flex-col gap-2">
                  <div>
                    <p className="text-sm font-medium text-[#1F3A2E]">{s.businessName}</p>
                    <a
                      href={`${BACKEND_URL}/site/${s.slug}`}
                      target="_blank"
                      rel="noreferrer"
                      className="text-xs text-[#6B5B95] underline break-all"
                    >
                      {BACKEND_URL}/site/{s.slug}
                    </a>
                  </div>
                  <div className="flex gap-2">
                    <button
                      onClick={() => openSiteForEdit(s)}
                      className="flex-1 py-1.5 text-xs rounded bg-[#1F3A2E] text-white font-medium"
                    >
                      Edit
                    </button>
                    <button
                      onClick={() => openMessagesForSite(s.slug)}
                      className="flex-1 py-1.5 text-xs rounded border border-[#1F3A2E] text-[#1F3A2E] font-medium"
                    >
                      Messages
                    </button>
                    <button
                      onClick={() => deleteSite(s.slug)}
                      disabled={deletingSlug === s.slug}
                      className="flex-1 py-1.5 text-xs rounded border border-[#C9532F] text-[#C9532F] font-medium disabled:opacity-40"
                    >
                      {deletingSlug === s.slug ? "Deleting..." : "Delete"}
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {showMessages && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-lg w-full max-w-md max-h-[80vh] overflow-y-auto">
            <div className="flex items-center justify-between p-4 border-b border-[#E5DFD1] sticky top-0 bg-white">
              <h2 className="font-semibold text-[#1F3A2E]">Messages</h2>
              <button onClick={() => setShowMessages(false)} className="text-sm text-[#A79E8C]">
                Close
              </button>
            </div>
            <div className="p-4 flex flex-col gap-2">
              {loadingMessages && <p className="text-sm text-[#6B6455]">Loading...</p>}
              {!loadingMessages && messagesList.length === 0 && (
                <p className="text-sm text-[#6B6455]">No messages yet.</p>
              )}
              {messagesList.map((m, i) => (
                <div key={i} className="border border-[#E5DFD1] rounded-md p-3">
                  <p className="text-sm font-medium text-[#1F3A2E]">{m.name}</p>
                  {m.email && <p className="text-xs text-[#6B5B95]">{m.email}</p>}
                  <p className="text-xs text-[#6B6455] mt-1">{m.message}</p>
                  <p className="text-[10px] text-[#A79E8C] mt-1">{new Date(m.createdAt).toLocaleString()}</p>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AIWebsiteBuilder />);
</script>
</body>
</html>
